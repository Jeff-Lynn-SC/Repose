  else if(type===SHOT.TRIPOD){
    var mi=pickBusyMachine(); m=machineAt(mi);
    if(!m){ frameOn(0,0,HALF*0.8,HALF*0.3,az); camP1.copy(camP0); camT1.copy(camT0); }
    else{
      frameOn(m.x,m.z,randIn(8,16)*machLen,randIn(0.5,1.1)*machLen,az);
      camP1.copy(camP0);                              /* locked off; let them move through it */
      camT1.copy(camT0);
      dur=randIn(11,18);
    }
  }
  else if(type===SHOT.FOLLOW||type===SHOT.WORK){
    var mi2=(pinIx>=0&&pinIx<nB)?pinIx:pickBusyMachine();
    shot={type:type,follow:mi2,end:0};
    dur=type===SHOT.WORK?randIn(9,15):randIn(11,18);
  }

  shot=shot&&shot.follow!==undefined&&(type===SHOT.FOLLOW||type===SHOT.WORK)
      ? {type:type,follow:shot.follow}
      : {type:type};
  shot.t0=now; shot.dur=dur*1000;
  shotEnd=now+shot.dur;
  sinceDip++;
  if(sinceDip>7 && Math.random()<0.4){ sinceDip=0; dipUntil=now+700; }
}

/* ---------------------------------------------------------
   Taking the wheel. Not part of the piece: it is here so the
   thing can be looked at properly rather than only watched.
   --------------------------------------------------------- */
var pinIx=-1;
var man={on:false,tx:0,ty:0,tz:0,th:-0.9,ph:0.95,r:200};
function manualOn(tx,ty,tz,r){
  man.on=true; man.tx=tx; man.ty=ty; man.tz=tz; man.r=r;
  document.getElementById("dev").style.display="block";
}
function driveManual(dt){
  man.ph=Math.max(0.05,Math.min(1.55,man.ph));
  man.r=Math.max(machLen*2,Math.min(HALF*6,man.r));
  var sp=Math.sin(man.ph);
  var fx=-Math.cos(man.th), fz=-Math.sin(man.th);
  var pan=man.r*0.6*dt;
  if(keys.w){ man.tx+=fx*pan; man.tz+=fz*pan; }
  if(keys.s){ man.tx-=fx*pan; man.tz-=fz*pan; }
  if(keys.a){ man.tx+=fz*pan; man.tz-=fx*pan; }
  if(keys.d2){ man.tx-=fz*pan; man.tz+=fx*pan; }
  if(keys.q) man.ty-=pan*0.5;
  if(keys.e) man.ty+=pan*0.5;
  camera.position.set(man.tx+man.r*sp*Math.cos(man.th),
                      man.ty+man.r*Math.cos(man.ph),
                      man.tz+man.r*sp*Math.sin(man.th));
  camera.up.set(0,1,0);
  camera.lookAt(man.tx,man.ty,man.tz);
}
var keys={};
var handheld=0;
function driveCamera(now,dt){
  if(!ready||!hCur) return;
  if(man.on){ driveManual(dt); return; }
  if(now>peakScan){ scanPeak(); peakScan=now+3000; }
  if(!shot||now>shotEnd) chooseShot();
  var u=Math.min(1,(now-shot.t0)/shot.dur);
  var e=u*u*(3-2*u);                                  /* ease, so nothing starts or stops hard */

  if(shot.type===SHOT.FOLLOW||shot.type===SHOT.WORK){
    var m=machineAt(shot.follow);
    if(!m){ chooseShot(); return; }
    var back=shot.type===SHOT.WORK?3.2:6.0, side=shot.type===SHOT.WORK?2.4:1.6;
    var hgt=shot.type===SHOT.WORK?1.0:2.1;
    var a=m.ang+Math.PI+ (shot.type===SHOT.WORK?1.1:0.35);
    var cx=m.x+Math.cos(a)*back*machLen+Math.cos(a+1.57)*side*machLen*0.3;
    var cz=m.z+Math.sin(a)*back*machLen+Math.sin(a+1.57)*side*machLen*0.3;
    var cy=safeY(cx,cz,terrainAt(m.x,m.z)+hgt*machLen*(1-0.25*e));
    camera.position.lerp(_v.set(cx,cy,cz),Math.min(1,dt*2.2));
    var lx=m.x+Math.cos(m.ang)*1.2*machLen, lz=m.z+Math.sin(m.ang)*1.2*machLen;
    camT0.set(lx,terrainAt(lx,lz)+0.55*machLen,lz);
    camera.lookAt(camT0);
  }else{
    camera.position.lerpVectors(camP0,camP1,e);
    _v.lerpVectors(camT0,camT1,e);
    camera.lookAt(_v);
  }
  /* a little unsteadiness: nothing in the world is on a perfect motor */
  handheld+=dt;
  var amp=(shot.type===SHOT.TRIPOD?0.0006:0.0022);
  camera.rotation.x+=Math.sin(handheld*1.7)*amp+Math.sin(handheld*0.61)*amp*0.7;
  camera.rotation.y+=Math.cos(handheld*1.31)*amp+Math.sin(handheld*0.43)*amp*0.8;
}

/* =========================================================
   THE LOOK
   Rendered linear into a buffer, bloomed, tonemapped, then
   grained and vignetted on the way to the screen. Most of
   what reads as "photographed" rather than "rendered" is
   here rather than in the geometry.
   ========================================================= */
var rtType=renderer.capabilities.isWebGL2?THREE.HalfFloatType:
  (renderer.extensions.has("OES_texture_half_float_linear")?THREE.HalfFloatType:THREE.UnsignedByteType);
var rtScene=null, rtA=null, rtB=null;
var quadScene=new THREE.Scene(), quadCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
var quad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.MeshBasicMaterial());
quad.frustumCulled=false; quadScene.add(quad);

var bloomMat=new THREE.ShaderMaterial({
  uniforms:{ tSrc:{value:null}, uDir:{value:new THREE.Vector2(1,0)},
             uTexel:{value:new THREE.Vector2(1,1)}, uThresh:{value:0.72} },
  vertexShader:"varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }",
  fragmentShader:[
    "uniform sampler2D tSrc; uniform vec2 uDir; uniform vec2 uTexel; uniform float uThresh;",
    "varying vec2 vUv;",
    "vec3 bright(vec3 c){ float l=dot(c,vec3(0.2126,0.7152,0.0722));",
    "  return c*max(0.0,l-uThresh)/max(l,0.0001); }",
    "void main(){",
    "  vec2 o=uDir*uTexel;",
    "  vec3 s=bright(texture2D(tSrc,vUv).rgb)*0.227;",
    "  s+=bright(texture2D(tSrc,vUv+o*1.38).rgb)*0.316;",
    "  s+=bright(texture2D(tSrc,vUv-o*1.38).rgb)*0.316;",
    "  s+=bright(texture2D(tSrc,vUv+o*3.23).rgb)*0.070;",
    "  s+=bright(texture2D(tSrc,vUv-o*3.23).rgb)*0.070;",
    "  gl_FragColor=vec4(s,1.0);",
    "}"].join("\n")
});
var blurMat=new THREE.ShaderMaterial({
  uniforms:{ tSrc:{value:null}, uDir:{value:new THREE.Vector2(0,1)}, uTexel:{value:new THREE.Vector2(1,1)} },
  vertexShader:bloomMat.vertexShader,
  fragmentShader:[
    "uniform sampler2D tSrc; uniform vec2 uDir; uniform vec2 uTexel; varying vec2 vUv;",
    "void main(){ vec2 o=uDir*uTexel;",
    "  vec3 s=texture2D(tSrc,vUv).rgb*0.227;",
    "  s+=texture2D(tSrc,vUv+o*1.38).rgb*0.316; s+=texture2D(tSrc,vUv-o*1.38).rgb*0.316;",
    "  s+=texture2D(tSrc,vUv+o*3.23).rgb*0.070; s+=texture2D(tSrc,vUv-o*3.23).rgb*0.070;",
    "  gl_FragColor=vec4(s,1.0); }"].join("\n")
});
var compMat=new THREE.ShaderMaterial({
  uniforms:{ tScene:{value:null}, tBloom:{value:null}, uTime:{value:0},
             uExposure:{value:1.15}, uBloom:{value:0.55}, uDip:{value:0} },
  vertexShader:bloomMat.vertexShader,
  fragmentShader:[
    "uniform sampler2D tScene; uniform sampler2D tBloom;",
    "uniform float uTime; uniform float uExposure; uniform float uBloom; uniform float uDip;",
    "varying vec2 vUv;",
    "vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0); }",
    "float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }",
    "void main(){",
    "  vec2 d=vUv-0.5;",
    "  float r2=dot(d,d);",
    "  vec2 ca=d*r2*0.0035;",                       // the lens is not perfect
    "  vec3 c;",
    "  c.r=texture2D(tScene,vUv+ca).r;",
    "  c.g=texture2D(tScene,vUv).g;",
    "  c.b=texture2D(tScene,vUv-ca).b;",
    "  c+=texture2D(tBloom,vUv).rgb*uBloom;",
    "  c=aces(c*uExposure);",
    "  c*=1.0-r2*0.62;",                           // vignette
    "  float g=hash(vUv*vec2(1024.0,768.0)+uTime)-0.5;",
    "  c+=g*0.030;",                               // grain, so it is not glassy
    "  c*= (1.0-uDip);",
    "  gl_FragColor=vec4(pow(max(c,0.0),vec3(1.0/2.2)),1.0);",
    "}"].join("\n")
});

function makeTargets(w,h){
  [rtScene,rtA,rtB].forEach(function(t){ if(t) t.dispose(); });
  var opt={minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,
           format:THREE.RGBAFormat,type:rtType,encoding:THREE.LinearEncoding};
  rtScene=new THREE.WebGLRenderTarget(w,h,opt);
    /* the bloom runs at a fraction of the frame; smaller still on a phone,
     where the fill rate is what costs, not the geometry */
  var shift=(window.innerWidth<820)?3:2;
  var bw=Math.max(2,w>>shift), bh=Math.max(2,h>>shift);
  rtA=new THREE.WebGLRenderTarget(bw,bh,opt);
  rtB=new THREE.WebGLRenderTarget(bw,bh,opt);
  bloomMat.uniforms.uTexel.value.set(1/bw,1/bh);
  blurMat.uniforms.uTexel.value.set(1/bw,1/bh);
}
function pass(mat,target){
  quad.material=mat;
  renderer.setRenderTarget(target);
  renderer.render(quadScene,quadCam);
}
var BARE=false;
function present(now){
  if(BARE){ renderer.setRenderTarget(null); renderer.render(scene,camera); return; }
  renderer.setRenderTarget(rtScene);
  renderer.clear();
  renderer.render(scene,camera);
  bloomMat.uniforms.tSrc.value=rtScene.texture;
  bloomMat.uniforms.uDir.value.set(1,0);
  pass(bloomMat,rtA);
  blurMat.uniforms.tSrc.value=rtA.texture;
  blurMat.uniforms.uDir.value.set(0,1);
  pass(blurMat,rtB);
  compMat.uniforms.tScene.value=rtScene.texture;
  compMat.uniforms.tBloom.value=rtB.texture;
  compMat.uniforms.uTime.value=now*0.001;
  compMat.uniforms.uDip.value=now<dipUntil?Math.sin(Math.min(1,(dipUntil-now)/700)*Math.PI):0;
  pass(compMat,null);
  renderer.setRenderTarget(null);
}

/* =========================================================
   THE WORLD, ELSEWHERE

   If WORLD_URL is set, the sand is not computed here. It is
   asked for, five times a second, and only what has moved
   comes back. The camera is still ours: everybody is looking
   at the same world and nobody at the same thing.

   If it cannot be reached, the browser quietly computes its
   own world instead, and says so in the readout.
   ========================================================= */
/* ==================== THE WORLD'S ADDRESS ====================
   Leave null and every browser computes its own world. Set it to the
   address of a running server and they all share one instead.
   ?world=https://... overrides it, for testing.
   ============================================================= */
var WORLD_HOME="https://repose-qd2m.onrender.com";
var WORLD_URL=Q.get("world")||WORLD_HOME;
var netOn=false, netSince=0, netFail=0, netAt=0, netKB=0, netVisitors=0, netPolls=0, netBuild=null, netRaise=0, netFill=0;
var netH=null, netW=null, netR=null;

function myId(){
  var k="repose.id", v=null;
  try{ v=localStorage.getItem(k); if(!v){ v=Math.random().toString(36).slice(2)+Date.now().toString(36);
       localStorage.setItem(k,v); } }catch(err){ v="anon"+Math.random(); }
  return v;
}
function netJoin(){
  fetch(WORLD_URL+"/join?id="+encodeURIComponent(myId()),{cache:"no-store"})
    .then(function(r){ return r.json(); })
    .then(function(j){ netVisitors=j.visitors; sharedCount=j.visitors;
                       if(j.build) netBuild=j.build; })
    .catch(function(){});
}
function netPoll(){
  if(!netOn) return;
  fetch(WORLD_URL+"/state?since="+netSince,{cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
    .then(function(buf){ netApply(new DataView(buf)); netFail=0; })
    .catch(function(){
      if(++netFail===6){ netOn=false; console.warn("the world is not answering; computing one here instead");
        startLocal(); }
    });
}
function netApply(d){
  var o=0;
  var version=d.getUint32(o,true); o+=4;
  var n2=d.getUint16(o,true); o+=2;
  var count=d.getUint16(o,true); o+=2;
  var cs=d.getFloat32(o,true); o+=4;
  var half=d.getFloat32(o,true); o+=4;
  var base=d.getFloat32(o,true); o+=4;
  var mlen=d.getFloat32(o,true); o+=4;
  var mix=d.getFloat32(o,true); o+=4;
  var rep=d.getFloat32(o,true); o+=4;
  var wind=d.getFloat32(o,true); o+=4;
  netVisitors=d.getUint32(o,true); o+=4;
  var changed=d.getUint32(o,true); o+=4;

  if(N!==n2||!netH){
    N=n2; CS=cs; HALF=half; BASE=base;
    netH=new Float32Array(N*N); netW=new Float32Array(N*N); netR=new Float32Array(N*N);
    for(var q=0;q<netH.length;q++) netH[q]=base;
    hA=null; hB=null; agA=null; agB=null;
    buildTerrain();
  }
  machLen=mlen; sharedCount=netVisitors;
  SCALE.pop=netVisitors;
  era={day:0,mix:mix,repose:rep,windStr:wind,windDir:0};

  /* the machines, all of them, every time: they are small and they all move */
  var ag=new Float32Array(count*12), P=Math.PI/32767;
  for(var i=0;i<count;i++){
    var p=i*12;
    ag[p]  =d.getInt16(o,true)/32767*half; o+=2;
    ag[p+1]=d.getInt16(o,true)/32767*half; o+=2;
    ag[p+2]=d.getInt16(o,true)*P; o+=2;
    ag[p+3]=d.getInt16(o,true)*P; o+=2;
    ag[p+4]=d.getInt16(o,true)*P; o+=2;
    ag[p+5]=d.getInt16(o,true)*P; o+=2;
    ag[p+6]=d.getInt16(o,true)*P; o+=2;
    ag[p+7]=d.getUint8(o)/255; o+=1;
    ag[p+8]=d.getUint8(o); o+=1;
    ag[p+9]=d.getUint8(o)/255; o+=1;
    ag[p+10]=ag[p]; ag[p+11]=ag[p+1];
  }
  /* and only the ground that has moved */
  for(var c=0;c<changed;c++){
    var idx=d.getUint32(o,true); o+=4;
    netH[idx]=d.getInt16(o,true)/100; o+=2;
    netW[idx]=d.getUint8(o)/255; o+=1;
    netR[idx]=d.getUint8(o)/255; o+=1;
  }
  var nr=0;
  for(var c2=0;c2<count;c2++) if(ag[c2*12+8]===0) nr++;
  netRaise=nr; netFill=count-nr;
  netSince=version;
  netKB+=(d.byteLength/1024); netPolls++;

  hA=hB||new Float32Array(netH); agA=agB||new Float32Array(ag); nA=nB||count; tA=tB;
  hB=new Float32Array(netH); agB=ag; nB=count; wearB=netW; rockB=netR;
  tB=performance.now();
  articulate=count<=400; setDetail(articulate);
  measurePopulation();
  stats={mean:base,max:0,gini:0,stripped:0,buried:0,tracked:0,collapses:0,
         nA:0,nB:0,mass:0,alive:count,wanted:netVisitors,births:0,deaths:0};
  ready=true;
}
function startWorldLink(){
  netOn=true;
  netJoin();
  netPoll();
  setInterval(netPoll,200);
}

/* =========================================================
   THE WORKER AND THE LOOP

   The pit is kept in this browser. Come back tomorrow and it is
   the pit you left, weathered by however long you were gone, and
   under whatever sky the calendar has moved on to.
   ========================================================= */
/* ==================== LAUNCH SWITCH ====================
   Before launch: leave this alone. The clock starts at the moment this file
   was built, and the saved world is tied to that build — so every time you
   rebuild and publish, Repose begins again at six machines in empty sand.

   On launch day: set LAUNCH to that date and never touch it again. The clock
   then counts from there for good, and the saved world stops being thrown
   away with each build.
   ======================================================= */
var BUILT=1788336981378  /* 2026-09-02 08:16 UTC */;                 /* stamped in when this file was made */
var LAUNCH=null;                     /* e.g. Date.UTC(2026,9,5) for 5 Oct 2026 */

var EPOCH   = (LAUNCH!==null) ? LAUNCH : BUILT;
var WORLDTAG= (LAUNCH!==null) ? "live" : ("b"+BUILT);
var SAVEKEY ="repose.world."+WORLDTAG, VISITKEY="repose.visits."+WORLDTAG;


/* ===================================================================
   THE WORKSHOP
   None of this is part of the piece. It is off unless asked for, and
   it exists so the thing can be tested without waiting ten years.

     ?dev            a small readout, bottom left
     ?days=400       pretend it has been running that long
     ?visits=900     pretend that many people have been
     ?pop=3200       set the population outright
     ?time=6         run the clock faster
     ?fresh          ignore the saved pit
     ?nosave         do not write one either
     ?shot=work      hold one kind of shot

     r               start the pit again, keep the visitors
     shift-R         start again, forget the visitors too
     v               add twenty-five visitors and reload
     c               cut now
     d               show or hide the readout
   =================================================================== */
var DEV=Q.has("dev"), NOSAVE=Q.has("nosave");
var CLOCKSHIFT=(parseFloat(Q.get("days"))||0)*86400000;
var SHOTNAMES={wide:0,tripod:1,follow:2,work:3,summit:4,conflict:5,grand:6,aftermath:7};

/* ===================================================================
   REPOSE

   The angle of repose is the steepest face loose material will hold
   before it fails. It is the one law here that neither purpose can
   argue with: the raisers would build without limit and the sand
   will not let them.

   THE WORLD

   One square kilometre of sand, and that is all there will ever be.
   It does not grow. At eight machines it reads as endless; the
   measurements put saturation somewhere near two hundred machines to
   the hectare, which for this world is around twenty thousand, and at
   one more machine per visit that is a matter of decades rather than
   years. Nobody alive now need see it fill. That it can fill at all
   is the point.

   HOW MANY MACHINES

   One more machine for every visit. Nobody is keeping a register, so
   the count is your own returning plus a steady drift standing in for
   everyone else's. The pit widens to keep the machines the same
   distance apart, which means it slowly stops being a yard with six
   diggers in it and becomes a landscape with a population.

   Day one: six machines in a forty-metre yard.
   A month: forty, in the pit this was tuned on.
   A year: four hundred, and no single machine explains the shape.
   Ten years: four thousand, a kilometre across, and they stop being
   machines at all and become a density.
   =================================================================== */
/* ===================================================================
   ONE EACH

   Repose opens with nothing in it. Every person who comes puts one
   machine in, and only one: coming back a second time adds nothing,
   and neither does reloading. What the population is, is the number
   of people who have ever looked at it.

   A browser can only count itself, so on its own this shows one
   machine to each visitor and no more. Point COUNTER_URL at anything
   that returns a running total and it becomes the true count, shared
   by everyone. Until then the number is honest but small.
   =================================================================== */
var COUNTER_URL=null;      /* e.g. "https://example.org/repose/visit" */
var MINEKEY="repose.mine."+"", sharedCount=null;

function myContribution(){
  var forced=parseInt(Q.get("visits"),10);
  if(forced>=0) return forced;
  try{
    if(localStorage.getItem(VISITKEY+".mine")) return 1;   /* already put one in */
    localStorage.setItem(VISITKEY+".mine","1");
  }catch(err){}
  return 1;
}
/* if a counter is configured, ask it how many there have been, and tell it
   about this one exactly once */
function askCounter(){
  if(!COUNTER_URL||typeof fetch!=="function") return;
  var mine=false;
  try{ mine=!!localStorage.getItem(VISITKEY+".counted"); }catch(err){}
  fetch(COUNTER_URL+(mine?"":"?add=1"),{cache:"no-store"})
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(!j||typeof j.count!=="number") return;
      try{ localStorage.setItem(VISITKEY+".counted","1"); }catch(err){}
      sharedCount=j.count;
      if(worker) worker.postMessage({type:"setPop",n:Math.max(1,j.count)});
      SCALE.pop=Math.max(1,j.count);
    })
    .catch(function(){});
}
var WORLD=1000, WORLDN=180;
function worldScale(visits){
  var days=Math.max(0,(Date.now()+CLOCKSHIFT-EPOCH)/86400000);
  var pop=parseInt(Q.get("pop"),10)>0?parseInt(Q.get("pop"),10)
          :(sharedCount!==null?Math.max(1,sharedCount):visits);
  return {ix:0,N:WORLDN,width:WORLD,pop:pop,vis:0.233,field:pop>3000,days:days};
}
var VISITS=myContribution(), SCALE=worldScale(VISITS);
function b64(f){
  var u=new Uint8Array(f.buffer,f.byteOffset,f.byteLength), s="";
  for(var i=0;i<u.length;i+=8192) s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));
  return btoa(s);
}
function unb64(str){
  var bin=atob(str), u=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  return new Float32Array(u.buffer);
}
function saveState(d){
  if(NOSAVE) return;
  try{
    localStorage.setItem(SAVEKEY,JSON.stringify({
      at:d.at, N:d.N, width:d.width,
      h:b64(d.h), wear:b64(d.wear), rock:b64(d.rock), h0:b64(d.h0)}));
  }catch(err){ /* private mode, or out of room: the pit simply starts again */ }
}
function loadState(){
  try{
    if(Q.has("fresh")) return null;
    var raw=localStorage.getItem(SAVEKEY); if(!raw) return null;
    var o=JSON.parse(raw); if(!o.N||!o.h) return null;
    /* a save from a smaller pit is not stale, it is history: it gets resampled */
    return {at:o.at,N:o.N,width:o.width||(o.N*1),
            h:unb64(o.h),wear:unb64(o.wear),rock:unb64(o.rock),h0:unb64(o.h0)};
  }catch(err){ return null; }
}

var worker=null, INLINE=false, snapCount=0, startedAt=0;

/* Some places a page can be opened will not let it start a worker from a blob:
   a sandboxed frame, a strict content policy, an old browser. The pit should
   not be a blank sky because of that, so it falls back to running the
   simulation on this thread. Slower, and it can stutter, but it runs. */
function startInline(src){
  INLINE=true;
  var shim={ postMessage:function(m){ onSim({data:m}); }, onmessage:null };
  try{ (new Function("self",src))(shim); }
  catch(err){ fail("the simulation would not start: "+err.message); return; }
  worker={ postMessage:function(m){ if(shim.onmessage) shim.onmessage({data:m}); } };
  boot();
}
function fail(msg){
  var e=document.getElementById("dev");
  if(e){ e.style.display="block"; e.textContent=msg; }
  if(window.console) console.error(msg);
}
function startLocal(){ startWorker(true); }
function startWorker(force){
  /* if there is one world, ask it; otherwise compute one here */
  if(!force && WORLD_URL){ startedAt=Date.now(); startWorldLink(); return; }
  var src=document.getElementById("simsrc").textContent;
  startedAt=Date.now();
  try{
    var url=URL.createObjectURL(new Blob([src],{type:"application/javascript"}));
    worker=new Worker(url);
  }catch(err){ startInline(src); return; }
  worker.onerror=function(){ if(!snapCount){ try{worker.terminate();}catch(e2){} startInline(src); } };
  /* and if it was created but never speaks, treat that as a failure too */
  setTimeout(function(){ if(!snapCount && !INLINE){ try{worker.terminate();}catch(e2){} startInline(src); } },3500);
  worker.onmessage=onSim;
  boot();
}
function onSim(e){
    var d=e.data;
    if(d.type==="save"){ saveState(d); return; }
    if(d.type==="restored"){
      console.log("left "+d.hours.toFixed(1)+"h; "+d.steps+" steps of weather");
      return;
    }
    if(d.type!=="snap") return;
    snapCount++;
    if(d.N!==N||d.CS!==CS){
      N=d.N; CS=d.CS; HALF=d.HALF; BASE=d.BASE;
      hA=null; hB=null; agA=null; agB=null;
      buildTerrain();
    }
    machLen=d.machLen; fieldMode=d.fieldMode;
    articulate=d.n<=400; setDetail(articulate);
    var msg={type:"recycle"}, give=[];
    if(hA){ msg.h=hA.buffer; give.push(hA.buffer); }
    if(agA){ msg.agents=agA.buffer; give.push(agA.buffer); }
    if(wearB){ msg.wear=wearB.buffer; give.push(wearB.buffer); }
    if(rockB){ msg.rock=rockB.buffer; give.push(rockB.buffer); }
    /* only hand buffers back when they can actually be transferred away;
       inline they are still ours and reusing them would corrupt the frame */
    if(give.length && !INLINE) worker.postMessage(msg,give);
    hA=hB; agA=agB; nA=nB; tA=tB;
    hB=d.h; agB=d.agents; nB=d.n; wearB=d.wear; rockB=d.rock; era=d.era; tB=performance.now();
    if(!hA){ hA=new Float32Array(hB); agA=new Float32Array(agB); nA=nB; tA=tB-33; }
    for(var k=0;k<d.dustN;k++){
      var p=k*10;
      puff(d.dust[p],d.dust[p+1],d.dust[p+2],d.dust[p+3],d.dust[p+4],d.dust[p+5],
           d.dust[p+6],d.dust[p+7],d.dust[p+8],d.dust[p+9]);
    }
    var now=performance.now();
    for(var j=0;j<d.evN;j++){
      var q=j*4;
      events.push({kind:d.events[q],x:d.events[q+1],z:d.events[q+2],mag:d.events[q+3],t:now});
    }
    if(events.length>80) events.splice(0,events.length-80);
    stats=d.stats; ready=true;
    measurePopulation();
}
/* where they are, and how far they have got: at eight machines in a square
   kilometre the pit is not the subject, they are. */
var popX=0, popZ=0, popR=1;
function measurePopulation(){
  if(!agB||!nB) return;
  var cx=0,cz=0,i;
  for(i=0;i<nB;i++){ cx+=agB[i*12]; cz+=agB[i*12+1]; }
  cx/=nB; cz/=nB;
  var r=0;
  for(i=0;i<nB;i++){
    var dx=agB[i*12]-cx, dz=agB[i*12+1]-cz;
    var d=Math.sqrt(dx*dx+dz*dz); if(d>r) r=d;
  }
  popX+=(cx-popX)*0.08; popZ+=(cz-popZ)*0.08;
  popR+=(Math.max(r,8*machLen)-popR)*0.08;
  /* the sun only needs to cast where anyone is standing */
  if(sun.shadow&&sun.shadow.camera){
    var d2=Math.max(popR*1.5,30*machLen);
    var sc=sun.shadow.camera;
    if(Math.abs(sc.right-d2)>d2*0.15){
      sc.left=-d2; sc.right=d2; sc.top=d2; sc.bottom=-d2; sc.updateProjectionMatrix();
    }
    sunTargetX=popX; sunTargetZ=popZ; sunDist=Math.max(d2*2.2,200);
  }
}
function boot(){
  worker.postMessage({type:"init",mix:0.5,rate:1,repose:34,scale:SCALE,
    clockShift:CLOCKSHIFT,saved:loadState()});
  worker.postMessage({type:"set",key:"time",value:parseFloat(Q.get("time"))||TIME});
}

function resize(){
  var w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h);
  var pr=renderer.getPixelRatio();
  makeTargets(Math.max(2,Math.floor(w*pr)),Math.max(2,Math.floor(h*pr)));
  camera.aspect=w/h; camera.updateProjectionMatrix();
}
window.addEventListener("resize",resize);

/* ---- workshop wiring ---- */
if(Q.get("shot")!==null && SHOTNAMES[Q.get("shot")]!==undefined) forceType=SHOTNAMES[Q.get("shot")];
var devEl=document.getElementById("dev");
if(DEV) devEl.style.display="block";
/* dragging takes the camera off the director */
var dragging=false,lastX=0,lastY=0,pinch=0,panLast=null;
var cv=renderer.domElement;
function grabCamera(){ if(!man.on) manualOn(popX,BASE,popZ,Math.max(popR*2.5,60*machLen)); }
cv.addEventListener("pointerdown",function(e){
  dragging=true; lastX=e.clientX; lastY=e.clientY; grabCamera();
});
window.addEventListener("pointerup",function(){ dragging=false; });
window.addEventListener("pointercancel",function(){ dragging=false; });
cv.addEventListener("pointermove",function(e){
  if(!dragging||pinch) return;
  man.th-=(e.clientX-lastX)*0.005;
  man.ph-=(e.clientY-lastY)*0.005;
  lastX=e.clientX; lastY=e.clientY;
});
/* two fingers: pinch to come closer, drag to move over the ground */
function twoFinger(e){
  var a=e.touches[0], b=e.touches[1];
  return {d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),
          x:(a.clientX+b.clientX)/2, y:(a.clientY+b.clientY)/2};
}
cv.addEventListener("touchstart",function(e){
  if(e.touches.length===2){ grabCamera(); var t=twoFinger(e); pinch=t.d; panLast=t; dragging=false; }
},{passive:true});
cv.addEventListener("touchmove",function(e){
  if(e.touches.length!==2) return;
  e.preventDefault();
  var t=twoFinger(e);
  if(pinch) man.r*=pinch/t.d;
  if(panLast){
    var k=man.r*0.0022;
    var fx=-Math.cos(man.th), fz=-Math.sin(man.th);
    var dx=t.x-panLast.x, dy=t.y-panLast.y;
    man.tx+= (fz*dx - fx*dy)*k;
    man.tz+= (-fx*dx - fz*dy)*k;
  }
  pinch=t.d; panLast=t;
},{passive:false});
cv.addEventListener("touchend",function(e){
  if(e.touches.length<2){ pinch=0; panLast=null; }
},{passive:true});
cv.addEventListener("wheel",function(e){
  e.preventDefault();
  if(!man.on) manualOn(popX,BASE,popZ,Math.max(popR*2.5,60*machLen));
  man.r*=Math.pow(1.0018,e.deltaY);
},{passive:false});
window.addEventListener("keyup",function(e){
  var k=e.key.toLowerCase();
  if(k==="w")keys.w=false; if(k==="s")keys.s=false;
  if(k==="a")keys.a=false; if(k==="d")keys.d2=false;
  if(k==="q")keys.q=false; if(k==="e")keys.e=false;
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  var lk=k.toLowerCase();
  if(lk==="w")keys.w=true; if(lk==="s")keys.s=true;
  if(lk==="a")keys.a=true; if(lk==="d")keys.d2=true;
  if(lk==="q")keys.q=true; if(lk==="e")keys.e=true;
  if(k===" "){ man.on=!man.on; if(man.on) manualOn(popX,BASE,popZ,Math.max(popR*2.5,60*machLen)); return; }
  if(lk==="o"){ manualOn(0,BASE,0,HALF*1.6); return; }          /* the whole world */
  if(lk==="f"){ manualOn(popX,BASE,popZ,Math.max(popR*2.2,40*machLen)); return; }
  if(lk==="p"){ reveal=!reveal; return; }
  if(lk==="k"){                       /* step the clock round the day, for looking */
    FORCED_HOUR = (FORCED_HOUR===null)?0:(FORCED_HOUR+3);
    if(FORCED_HOUR>23){ FORCED_HOUR=null; }
    lastSkyAlt=999; updateSun(); return; }
  if(lk==="b"){ BARE=!BARE; return; }
  if(k==="m"){ addMachines(10); return; }
  if(k==="M"){ addMachines(200); return; }
  if(k==="R"){ try{localStorage.removeItem(SAVEKEY);localStorage.removeItem(VISITKEY);}catch(err){} location.reload(); }
  else if(k==="r"){ try{localStorage.removeItem(SAVEKEY);}catch(err){} location.reload(); }
  else if(k==="v"){ try{localStorage.setItem(VISITKEY,String(VISITS+25));}catch(err){} location.reload(); }
  else if(k==="c"){ shotEnd=0; }
  else if(k==="d"&&!keys.d2){ cycleOverlay(); }
});
/* A way in that needs no address bar: three taps in the top-left corner.
   Nobody finds it by accident, and it works wherever the thing is opened. */
(function(){
  var taps=0, first=0;
  window.addEventListener("pointerdown",function(e){
    if(e.clientX>window.innerWidth*0.18||e.clientY>window.innerHeight*0.18) return;
    var t=Date.now();
    if(t-first>1400){ first=t; taps=0; }
    taps++;
    if(taps>=3){
      taps=0; cycleOverlay();
    }
  },true);
})();

/* nothing -> the figures -> the figures and the buttons -> nothing again */
var overlay=0;
function cycleOverlay(to){
  overlay=(to===undefined)?((overlay+1)%3):to;
  DEV=overlay>0;
  devEl.style.display=overlay>0?"block":"none";
  var pd=document.getElementById("pad");
  if(pd) pd.style.display=overlay>1?"grid":"none";
}

/* the same actions as the keys, for a screen with no keyboard */
(function(){
  var pad=document.getElementById("pad");
  if(!pad) return;
  if(DEV) cycleOverlay(2);
  var bs=pad.getElementsByTagName("button");
  for(var i=0;i<bs.length;i++){
    bs[i].addEventListener("click",function(ev){
      ev.preventDefault();
      var k=this.getAttribute("data-k");
      if(k==="space"){ man.on=!man.on; if(man.on) grabCamera(); }
      else if(k==="p") reveal=!reveal;
      else if(k==="R1") addMachines(1,"raise");
      else if(k==="F1") addMachines(1,"fill");
      else if(k==="n") nextMachine();
      else if(k==="pause") togglePause(this);
      else if(k==="o") manualOn(0,BASE,0,HALF*1.6);
      else if(k==="f") manualOn(popX,BASE,popZ,Math.max(popR*2.2,40*machLen));
      else if(k==="m") addMachines(10);
      else if(k==="M") addMachines(200);
      else if(k==="k"){ FORCED_HOUR=(FORCED_HOUR===null)?0:(FORCED_HOUR+3);
        if(FORCED_HOUR>23) FORCED_HOUR=null; lastSkyAlt=999; updateSun(); }
      else if(k==="b") BARE=!BARE;
      else if(k==="r"){ try{localStorage.removeItem(SAVEKEY);}catch(err){} location.reload(); }
    });
  }
})();
/* ---- looking at one machine at a time ----
   The director keeps its own counsel about which machine to follow, which is
   right for the piece and useless for watching one work. This pins it. */
function nextMachine(){
  if(!nB) return;
  pinIx=(pinIx+1)%nB;
  forceType=2;            /* hold the following shot */
  man.on=false;
  shotEnd=0;              /* cut to it now */
}
var paused=false;
function togglePause(btn){
  if(!netOn||!WORLD_URL) return;
  var k=Q.get("key"); if(!k) return;
  paused=!paused;
  if(btn) btn.textContent=paused?"run":"pause";
  fetch(WORLD_URL+"/speed?key="+encodeURIComponent(k)+"&x="+(paused?0:2.4),
        {cache:"no-store"}).catch(function(){});
}
function addMachines(n,role){
  if(netOn){
    /* the machines live on the server, so ask it. Needs ?key= on the URL —
       the same word set as RESET_KEY there — or it refuses, as it should. */
    var k=Q.get("key");
    if(!k){ if(window.console) console.warn("add ?key=<your reset key> to the URL to add machines"); return; }
    fetch(WORLD_URL+"/add?key="+encodeURIComponent(k)+"&n="+n+
          (role?"&role="+role:""),{cache:"no-store"})
      .then(function(r){ return r.json(); })
      .then(function(j){ if(j&&j.visitors!==undefined){ sharedCount=j.visitors; SCALE.pop=j.visitors; } })
      .catch(function(){});
    return;
  }
  SCALE.pop+=n;
  if(worker) worker.postMessage({type:"addPop",n:n});
}
var fps=0, fpsT=performance.now(), fpsN=0;
var SHOTLABEL=["wide","tripod","follow","work","summit","conflict","grand","aftermath"];
function updateDev(now){
  fpsN++;
  if(now-fpsT>500){ fps=fpsN*1000/(now-fpsT); fpsN=0; fpsT=now; }
  if(!DEV) return;
  var e=era||{};
  if(!ready){
    devEl.textContent=(netOn?"waiting for the world"+(netFail?"  ("+netFail+" tries)":"")
                            :"waiting for the simulation"+(INLINE?" (on this thread)":""))+
      "   "+((Date.now()-startedAt)/1000).toFixed(1)+"s";
    return;
  }
  devEl.innerHTML=
    "<b>page</b> "+new Date(BUILT).toISOString().slice(0,16).replace("T"," ")+
      (netBuild?"\n<b>world</b> "+netBuild:"")+"\n"+
    "<b>fps</b> "+fps.toFixed(0)+"  "+
      (netOn?("world "+netPolls+" updates, "+
              (netKB/Math.max(1,(Date.now()-startedAt)/1000)).toFixed(1)+" KB/s")
            :(INLINE?"inline":"worker")+" "+snapCount)+
      "  "+(man.on?"manual":("shot "+(shot?SHOTLABEL[shot.type]:"-")))+"\n"+
    "<b>day</b> "+(e.day!==undefined?e.day.toFixed(2):"-")+
      "  <b>machines</b> "+(stats?stats.alive:"-")+
      (netOn?"  <b>raising</b> "+netRaise+" <b>filling</b> "+netFill:"")+
      (reveal?"  [purpose shown]":"")+
      "  <b>visitors</b> "+(sharedCount!==null?sharedCount+" shared":VISITS+" local")+"\n"+
    "<b>sun</b> "+sunAlt.toFixed(0)+"\u00B0 "+
      (nightFactor>0.98?"night":(nightFactor>0.02?"dusk":"day"))+
      (FORCED_HOUR===null?"":" @"+FORCED_HOUR+"h")+
      "  raise "+(e.mix!==undefined?(e.mix*100).toFixed(0)+"%":"-")+
      "  repose "+(e.repose!==undefined?e.repose.toFixed(0)+"\u00B0":"-")+
      "  wind "+(e.windStr!==undefined?e.windStr.toFixed(2):"-")+"\n"+
    (stats?("<b>peak</b> "+stats.max.toFixed(1)+"m  stripped "+(stats.stripped*100).toFixed(1)+
      "%  tracked "+(stats.tracked*100).toFixed(0)+"%  collapses "+stats.collapses+
      "  born "+stats.births+" lost "+stats.deaths):"");
}

var lastSunAt=0;
var lastT=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  if(ready&&hA&&hB){
    var span=Math.max(16,tB-tA);
    var alpha=(now-LAG-tA)/span; alpha=alpha<0?0:(alpha>1?1:alpha);
    updateTerrain(alpha);
    drawMachines(alpha);
  }
  stepDust(dt);
  if(now-lastSunAt>2000){ lastSunAt=now; updateSun(); updateEnvironment(false); }
  driveCamera(now,dt);
  present(now);
  updateDev(now);
}

resize();
startWorker();
if(!WORLD_URL) askCounter();
requestAnimationFrame(frame);
})();
</script>
